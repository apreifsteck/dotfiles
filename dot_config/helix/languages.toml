[language-server.nextls]
command = "nextls"
args = ["--stdio=true"]

[language-server.expert]
command = "~/.local/bin/expert_darwin_amd64"

[language-server.cooklang-lsp]
command = "cook"
args = ["lsp"]

[[language]]
name = "elixir"
scope = "source.elixir"
language-servers = ["elixir-ls"]

[[language]]
name = "heex"
language-servers = ["expert"]

[[language]]
name = "cook"
scope = "source.cook"
file-types = ["cook"]
language-servers = ["cooklang-lsp"]

# Note: Needs manual install of kotlin lsp
# https://github.com/Kotlin/kotlin-lsp/releases

[language-server.kotlin-lsp]
command = "intellij-server"
args = ["--stdio"]

[[language]]
name = "kotlin"
language-servers = ["kotlin-lsp"]
